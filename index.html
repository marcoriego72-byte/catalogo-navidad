<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#EEF3F8;--card:#fff;--ink:#0F2740;--mute:#566678;--line:#D8E0E8;--navy:#193b51;--or:#F28A1E;--grn:#1F7A57;--red:#C8333B}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1B2E;--card:#12283F;--ink:#EAF0F6;--mute:#9FB0C2;--line:#23405C}}
:root[data-theme=dark]{--bg:#0B1B2E;--card:#12283F;--ink:#EAF0F6;--mute:#9FB0C2;--line:#23405C}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "DM Sans",system-ui,sans-serif}
body:before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}
button,input,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.hero{background:var(--navy);color:#fff;text-align:center;padding:16px 16px 26px}
.logo{display:block;margin:0 auto;width:300px;max-width:80%;border-radius:14px}
.lights{display:flex;justify-content:space-between;border-top:2px solid rgba(255,255,255,.28);margin:16px -4px 14px;padding:0 6px}
.lights i{display:block;width:10px;height:15px;margin-top:-1px;border-radius:50% 50% 50% 50%/35% 35% 65% 65%;background:var(--c);box-shadow:0 0 10px var(--c);animation:tw 2.6s ease-in-out infinite}
.lights i:nth-child(4n+1){--c:#E04650}.lights i:nth-child(4n+2){--c:#F28A1E;animation-delay:.6s}.lights i:nth-child(4n+3){--c:#2FA36F;animation-delay:1.2s}.lights i:nth-child(4n){--c:#FFD36B;animation-delay:1.8s}
@keyframes tw{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.lights i{animation:none}}
.pill{display:inline-block;background:var(--red);color:#fff;font:700 12px Sora,sans-serif;padding:5px 12px;border-radius:99px}
h1{font:800 26px/1.12 Sora,system-ui,sans-serif;margin:10px 0 6px}
.hero p{margin:0 auto;max-width:420px;color:#C9D6E3}
@media(min-width:600px){h1{font-size:34px}}
.btn.shr{display:inline-block;width:auto;margin-top:16px;padding:11px 22px;background:#fff;color:#0F2740}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.tb input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.chips{display:flex;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.chip{flex:0 0 auto;margin-right:8px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px "DM Sans",sans-serif;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:12px;max-width:1100px;margin:0 auto;padding:12px 12px 110px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{background:#fff;position:relative;padding-bottom:100%}

.card .btn{margin-top:0}

.fr{display:flex;margin-bottom:6px}.fi{position:relative;width:84px;height:84px;margin-right:10px;background:#fff;border-radius:8px;border:1px solid var(--line)}.fi img{width:100%;height:100%;object-fit:contain;border-radius:8px}.fx{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--red);color:#fff;font:700 18px/1 sans-serif;cursor:pointer}
.fb{position:relative;overflow:hidden;font-weight:700;font-size:14px;margin:8px 0 0}.f .fh{position:absolute;left:0;top:0;opacity:0;width:1px;height:1px;padding:0;border:0}
.ic{width:18px;height:18px;vertical-align:-4px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.perks{display:flex;justify-content:center;flex-wrap:wrap;margin:14px 0 0}.perks span{display:flex;align-items:center;margin:4px 10px;font-size:13px;color:#C9D6E3}.perks .ic{color:#FFD36B}

.sh h4{font:800 15px Sora,sans-serif;margin:16px 0 6px}

[].forEach.call(c.querySelectorAll('script'),function(s){if(s.id!=='state'&&s.id!=='main'&&s.id!=='err')s.parentNode.removeChild(s)});return '<!doctype html>\n'+c.outerHTML}
function publish(){var b=new Blob([docStr()],{type:'text/html'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='index.html';document.body.appendChild(l);l.click();setTimeout(function(){document.body.removeChild(l)},500);try{localStorage.removeItem('rrd')}catch(x){}dirty=false;drawEd();toast('Descargado. Súbelo a GitHub para publicar.')}
app.addEventListener('click',function(e){var t=e.target,a=null;
while(t&&t!==app){a=t.getAttribute&&t.getAttribute('data-a');if(a)break;t=t.parentNode}
if(!a||t===app)return;if(a==='x'&&e.target!==t)return;var id=t.getAttribute('data-id');
if(a==='add'){cart[id]=(cart[id]||0)+1;refresh()}
else if(a==='sub'){if(cart[id]>1)cart[id]--;else delete cart[id];refresh()}
else if(a==='cat'){cat=id;drawCh();drawGrid()}
else if(a==='cart'){sheet=true;cartSheet()}
else if(a==='x'){sheet=false;modal('')}
else if(a==='et'){edit=!edit;cart={};drawEd();drawGrid();drawBar()}
else if(a==='np')prodForm({name:'',desc:'',price:0,cat:cat==='Todos'?'':cat,isNew:true})
else if(a==='ep')prodForm(find(id))
else if(a==='sp')saveP(id)
else if(a==='dp'){if(!armed){armed=true;t.textContent='Toca otra vez para eliminar'}else{armed=false;S.items=S.items.filter(function(i){return i.id!==id});dirty=true;modal('');drawCh();drawGrid();drawEd()}}
else if(a==='set')modal('<h3>Ajustes</h3><div class="f"><label for="fw">Número de WhatsApp para pedidos</label><input id="fw" inputmode="numeric" value="'+esc(S.wa)+'" placeholder="Ej. 524421234567"><small>Solo números: 52 y tus 10 dígitos.</small><label for="fpn">PIN de administrador</label><input id="fpn" inputmode="numeric" value="'+esc(S.pin||'2026')+'"><small>Solo números. Cámbialo por uno tuyo.</small><label for="fl">Enlace del catálogo para compartir</label><input id="fl" value="'+esc(S.link||'')+'" placeholder="'+esc(base())+'"><small>Vacío = se usa el enlace de GitHub.</small><label for="fm">Mensaje al compartir</label><textarea id="fm" rows="5">'+esc(S.msg||DM)+'</textarea><small>El enlace se agrega al final automáticamente.</small><label for="fpy">Datos para transferencia</label><textarea id="fpy" rows="3" placeholder="Banco, CLABE y titular">'+esc(getPay())+'</textarea><small>Se guardan solo en este dispositivo, no en el catálogo público. Se usan en tu respuesta al cliente.</small></div><button class="btn" data-a="ss">Guardar</button><button class="btn alt" data-a="lo">Cerrar sesión de administrador</button><button class="btn alt" data-a="x">Cancelar</button>')
else if(a==='ss'){S.wa=$('fw').value.replace(/\D/g,'');S.pin=$('fpn').value.replace(/\D/g,'')||'2026';S.link=$('fl').value.trim();var mv=$('fm').value.trim();S.msg=(mv===DM)?'':mv;try{localStorage.setItem('rrp',$('fpy').value.trim())}catch(x){}dirty=true;modal('');drawEd()}
else if(a==='card')makeCard(find(id))
else if(a==='sh')share()
else if(a==='shr')shareLink()
else if(a==='cp')copyLink(shareText())
else if(a==='si')shareImg()
else if(a==='im'){sel[id]=+t.getAttribute('data-i');drawGrid()}
else if(a==='rf'){tl.splice(+t.getAttribute('data-i'),1);$('fz').innerHTML=fotos()}
else if(a==='lg'){taps++;clearTimeout(tt);tt=setTimeout(function(){taps=0},1500);if(taps>=5){taps=0;if(owner)toast('Ya estás en modo administrador');else askPin()}}
else if(a==='pin')tryPin()
else if(a==='oe'){ord.ent='E';cartSheet()}
else if(a==='or'){ord.ent='R';cartSheet()}
else if(a==='pf'){ord.pay='F';cartSheet()}
else if(a==='pt'){ord.pay='T';cartSheet()}
else if(a==='send')send()
else if(a==='lo'){try{localStorage.removeItem('rra')}catch(x){}location.reload()}
else if(a==='pub')publish()});
app.addEventListener('input',function(e){var t=e.target;if(t.id==='s'){q=t.value.trim().toLowerCase();drawGrid()}else if(t.getAttribute&&t.getAttribute('data-f')){ord[t.getAttribute('data-f')]=t.value}});
app.addEventListener('change',function(e){var t=e.target;if(t.id==='fdc')$('fow').style.display=t.checked?'block':'none';if((t.id==='ff'||t.id==='fc')&&t.files&&t.files.length){var fl=[].slice.call(t.files,0,3-tl.length),pend=fl.length;fl.forEach(function(f){shrink(f,function(u){tl.push(u);if(--pend===0)$('fz').innerHTML=fotos()})})}});
function adm(){try{return localStorage.getItem('rra')==='1'}catch(x){return false}}var taps=0,tt=0,ed=adm();if(ed){try{var dr=localStorage.getItem('rrd');if(dr){S=JSON.parse(dr);dirty=true}}catch(x){}}shell();drawCh();drawGrid();drawBar();drawEd();
if(ed){owner=true;art=true;drawEd();if(/^#r=/.test(location.hash))replyModal()}else if(location.hash==='#editar'||/^#r=/.test(location.hash))askPin();window.addEventListener('hashchange',function(){location.reload()});
})();
</script>
</body></html>
