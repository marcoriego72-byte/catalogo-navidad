<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Catálogo de Navidad · RR Technology</title><meta name="description" content="Audífonos, bocinas y cargadores 1Hora para esta Navidad. Arma tu pedido y envíalo por WhatsApp."><meta property="og:type" content="website"><meta property="og:title" content="Catálogo de Navidad · RR Technology"><meta property="og:description" content="Audífonos, bocinas y cargadores 1Hora para esta Navidad. Arma tu pedido y envíalo por WhatsApp."><meta property="og:image" content="https://TU-USUARIO.github.io/catalogo-navidad/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:url" content="https://TU-USUARIO.github.io/catalogo-navidad/"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎄%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#EEF3F8;--card:#fff;--ink:#0F2740;--mute:#566678;--line:#D8E0E8;--navy:#193b51;--or:#F28A1E;--grn:#1F7A57;--red:#C8333B}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1B2E;--card:#12283F;--ink:#EAF0F6;--mute:#9FB0C2;--line:#23405C}}
:root[data-theme=dark]{--bg:#0B1B2E;--card:#12283F;--ink:#EAF0F6;--mute:#9FB0C2;--line:#23405C}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "DM Sans",system-ui,sans-serif}
body:before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}
button,input,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.hero{background:var(--navy);color:#fff;text-align:center;padding:16px 16px 26px}
.logo{display:block;margin:0 auto;width:300px;max-width:80%;border-radius:14px}
.lights{display:flex;justify-content:space-between;border-top:2px solid rgba(255,255,255,.28);margin:16px -4px 14px;padding:0 6px}
.lights i{display:block;width:10px;height:15px;margin-top:-1px;border-radius:50% 50% 50% 50%/35% 35% 65% 65%;background:var(--c);box-shadow:0 0 10px var(--c);animation:tw 2.6s ease-in-out infinite}
.lights i:nth-child(4n+1){--c:#E04650}.lights i:nth-child(4n+2){--c:#F28A1E;animation-delay:.6s}.lights i:nth-child(4n+3){--c:#2FA36F;animation-delay:1.2s}.lights i:nth-child(4n){--c:#FFD36B;animation-delay:1.8s}
@keyframes tw{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.lights i{animation:none}}
.pill{display:inline-block;background:var(--red);color:#fff;font:700 12px Sora,sans-serif;padding:5px 12px;border-radius:99px}
h1{font:800 26px/1.12 Sora,system-ui,sans-serif;margin:10px 0 6px}
.hero p{margin:0 auto;max-width:420px;color:#C9D6E3}
@media(min-width:600px){h1{font-size:34px}}
.btn.shr{display:inline-block;width:auto;margin-top:16px;padding:11px 22px;background:#fff;color:#0F2740}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.tb input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.chips{display:flex;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.chip{flex:0 0 auto;margin-right:8px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px "DM Sans",sans-serif;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:12px;max-width:1100px;margin:0 auto;padding:12px 12px 110px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{background:#fff;position:relative;padding-bottom:100%}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.bgs{position:absolute;left:8px;top:8px;z-index:1}.badge{display:table;margin-bottom:4px;background:var(--or);color:#1a1205;font:700 11px Sora,sans-serif;padding:4px 9px;border-radius:99px}.badge.l{background:#FFD36B}.badge.d{background:var(--red);color:#fff}.old{margin-left:8px;color:var(--mute);font:500 13px "DM Sans",sans-serif;text-decoration:line-through}
.bd{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.nm{font:700 14px/1.25 Sora,system-ui,sans-serif;margin:0 0 4px}
.ds{color:var(--mute);font-size:12.5px;margin:0 0 8px;flex:1}
.pr{font:800 19px Sora,sans-serif;margin-bottom:8px}.pr.q{font:600 13px "DM Sans",sans-serif;color:var(--mute)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:11px 12px;font:700 14px "DM Sans",system-ui,sans-serif;background:var(--or);color:#1a1205;text-align:center;text-decoration:none;cursor:pointer;margin-top:8px}
.card .btn{margin-top:0}
.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.go{background:var(--grn);color:#fff}.pub{background:var(--grn);color:#fff}.del{background:transparent;color:var(--red);border:1px solid var(--red)}.btn[disabled]{opacity:.45}
.row{display:flex}.row .btn{font-size:13px}.row .btn+.btn{margin-left:6px}
.step{display:flex;align-items:center;justify-content:space-between}.step b{min-width:28px;text-align:center}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 20px sans-serif;cursor:pointer}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:space-between;background:var(--grn);color:#fff;border:0;border-radius:16px;padding:15px 18px;font:700 15px "DM Sans",sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:520px;margin:0 auto;width:calc(100% - 24px)}
.ov{position:fixed;left:0;right:0;top:0;bottom:0;z-index:50;background:rgba(5,15,28,.62);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh h3{font:800 18px Sora,sans-serif;margin:0 0 8px}
.f label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
.f input,.f textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.f .ck{display:flex;align-items:center}.f .ck input{width:auto;margin-right:8px}
.f small,.hint{color:var(--mute);font-size:13px}
.fv{width:90px;height:90px;object-fit:contain;background:#fff;border-radius:8px;display:block;margin-bottom:6px}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.li small{display:block;color:var(--mute)}.li .step{width:122px;flex:0 0 122px}
.tt{display:flex;justify-content:space-between;font-size:17px;margin:12px 0 0}
.cd{display:block;width:100%;border-radius:12px}
.edb{display:flex;flex-wrap:wrap;padding:8px;background:var(--card);border-bottom:1px solid var(--line)}.edb .btn{width:auto;flex:1 1 40%;margin:4px}
.warn{margin:0;padding:8px 14px;background:#FFF1D6;color:#5a3a00;font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute)}
.ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}.ts.on{opacity:1}
</style></head><body><div id="app"></div>

(function(){

function drawGrid(){var h='';
S.items.forEach(function(p){

function shrink(f,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)}
function loadI(s,f){var i=new Image();i.onload=function(){f(i)};i.src=s}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrap(x,t,cx,y,mw,lh){var w=t.split(' '),l='',i,tl;for(i=0;i<w.length;i++){tl=l?l+' '+w[i]:w[i];if(x.measureText(tl).width>mw&&l){x.fillText(l,cx,y);y+=lh;l=w[i]}else l=tl}x.fillText(l,cx,y)}

var W=1080,H=1350,c=document.createElement('canvas'),i;c.width=W;c.height=H;var x=c.getContext('2d');

for(i=0;i<60;i++){x.fillStyle='rgba(255,255,255,'+(.12+(i*7%10)/30)+')';x.beginPath();x.arc(i*263%W,i*541%H,2+i%4,0,6.3);x.fill()}
x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=3;x.beginPath();x.moveTo(0,36);x.lineTo(W,36);x.stroke();
var cl=['#E04650','#F28A1E','#2FA36F','#FFD36B'];for(i=0;i<12;i++){x.fillStyle=cl[i%4];x.beginPath();x.arc(45+i*90,56,13,0,6.3);x.fill()}
var lw=540,lh=lw*lg.height/lg.width;x.save();rr(x,(W-lw)/2,100,lw,lh,24);x.clip();x.drawImage(lg,(W-lw)/2,100,lw,lh);x.restore();
var py=100+lh+30;x.fillStyle='#fff';rr(x,110,py,860,640,40);x.fill();
var s=Math.min(780/im.width,580/im.height);x.drawImage(im,(W-im.width*s)/2,py+(640-im.height*s)/2,im.width*s,im.height*s);
var tg=[];if(p.isNew)tg.push(['Nuevo','#F28A1E','#1a1205']);if(p.last)tg.push(['Últimas piezas','#FFD36B','#1a1205']);if(p.disc)tg.push(['Con descuento','#C8333B','#fff']);x.font='700 28px Sora,Arial,sans-serif';x.textAlign='center';var ty=py+28;tg.forEach(function(g){var tw=x.measureText(g[0]).width+44;x.fillStyle=g[1];rr(x,140,ty,tw,52,26);x.fill();x.fillStyle=g[2];x.fillText(g[0],140+tw/2,ty+37);ty+=62});
x.textAlign='center';x.fillStyle='#fff';x.font='800 50px Sora,Arial,sans-serif';wrap(x,p.name,W/2,py+695,900,58);
if(p.disc&&p.old>0&&p.price>0){x.fillStyle='#9FB0C2';x.font='600 44px "DM Sans",Arial,sans-serif';var ot=money(p.old),ow=x.measureText(ot).width;x.fillText(ot,W/2,H-245);x.fillRect(W/2-ow/2,H-245-15,ow,4)}x.fillStyle='#F28A1E';x.font='800 '+(p.price>0?84:52)+'px Sora,Arial,sans-serif';x.fillText(p.price>0?money(p.price):'Pregunta por tu precio',W/2,H-140);
x.fillStyle='#1F7A57';x.fillRect(0,H-90,W,90);x.fillStyle='#fff';x.font='700 34px "DM Sans",Arial,sans-serif';x.fillText('Pide por WhatsApp'+(S.wa?' · '+S.wa:''),W/2,H-33);
modal('<h3>Tarjeta para estados y difusión</h3><img class="cd" alt="Tarjeta de '+esc(p.name)+'" src="'+c.toDataURL('image/jpeg',.92)+'"><p class="hint">Mantén presionada la imagen para guardarla.</p>'+(navigator.canShare?'<button class="btn" data-a="sh">Compartir</button>':'')+'<button class="btn alt" data-a="x">Cerrar</button>');
c.toBlob(function(b){blob=b},'image/jpeg',.92)})})}

else if(a==='ss'){S.wa=$('fw').value.replace(/\D/g,'');S.link=$('fl').value.trim();dirty=true;modal('');drawEd()}
